name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JS dependencies
        run: |
          for i in 1 2 3; do
            npm install --legacy-peer-deps --no-audit --no-fund && exit 0
            sleep 15
          done
          exit 1

      - name: Align Expo native peers
        run: npx expo install --fix || true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK env
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"

      - name: Accept licenses and ensure platform
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SM" --licenses >/tmp/lic.txt 2>&1 || true
          "$SM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Expo prebuild
        env:
          EXPO_NO_NEW_ARCH: "1"
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Patch Android build
        run: python3 scripts/patch-android-build.py

      - name: Build RELEASE APK (embedded JS — no Metro)
        working-directory: android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify bundle inside APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "APK=$APK"
          ls -lh "$APK"
          unzip -l "$APK" | grep -iE 'index.android.bundle' | head -5
          # Fail if JS bundle missing
          unzip -l "$APK" | grep -q 'index.android.bundle'
          cp "$APK" Shopify-Simulator.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shopify-Simulator-APK
          path: Shopify-Simulator.apk
          if-no-files-found: error
          retention-days: 30
